<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<header ref="{{ headerRef }}" style="position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid rgba(23,36,110,0.08);transition:box-shadow .3s ease,background .3s ease;font-family:'Plus Jakarta Sans',sans-serif">
  <nav style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <span style="width:42px;height:42px;flex:none;filter:drop-shadow(0 3px 6px rgba(18,166,206,.35))"><dc-import name="Logo" hint-size="42px,42px"></dc-import></span>
      <span style="display:flex;flex-direction:column;line-height:1">
        <span style="font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:.02em;color:#17246E">STEAPHIIN</span>
        <span style="font-size:10px;font-weight:600;letter-spacing:.28em;color:#12A6CE;margin-top:3px">HIGH SCHOOL</span>
      </span>
    </a>
    <sc-if value="{{ showDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:4px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
          <a href="{{ l.href }}" style="display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:8px 13px;font-size:14.5px;color:{{ l.color }};font-weight:{{ l.weight }};transition:color .2s" style-hover="color:#12A6CE">
            <span>{{ l.label }}</span>
            <span style="height:2px;width:100%;border-radius:2px;margin-top:5px;background:{{ l.underlineBg }};transition:background .2s"></span>
          </a>
        </sc-for>
        <a href="admissions.dc.html" style="margin-left:10px;white-space:nowrap;text-decoration:none;background:linear-gradient(135deg,#F6C21C,#F0A400);color:#17246E;font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(240,164,0,.35);transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-2px);box-shadow:0 10px 26px rgba(240,164,0,.5)">Apply Now</a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="background:#17246E;border:none;width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:20px;height:2.5px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2.5px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2.5px;background:#fff;border-radius:2px"></span>
      </button>
    </sc-if>
  </nav>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <div style="padding:8px 20px 20px;display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(23,36,110,.08)">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" style="text-decoration:none;padding:13px 12px;font-size:16px;color:{{ l.color }};font-weight:{{ l.weight }};border-radius:10px;border-left:3px solid {{ l.underlineBg }}" style-hover="background:#F3F6FF">{{ l.label }}</a>
      </sc-for>
      <a href="admissions.dc.html" style="margin-top:8px;text-align:center;text-decoration:none;background:linear-gradient(135deg,#F6C21C,#F0A400);color:#17246E;font-weight:700;padding:14px;border-radius:12px">Apply Now</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled:false, isMobile:false, menuOpen:false };
  headerRef = React.createRef();
  componentDidMount(){
    this._scroll = () => {
      const s = window.scrollY > 16;
      if (this.headerRef.current) this.headerRef.current.style.boxShadow = s ? '0 8px 30px rgba(23,36,110,.12)' : 'none';
    };
    this._resize = () => {
      const m = window.innerWidth < 1080;
      if (m !== this.state.isMobile) this.setState({ isMobile:m, menuOpen:false });
    };
    window.addEventListener('scroll', this._scroll, {passive:true});
    window.addEventListener('resize', this._resize);
    this._resize(); this._scroll();
  }
  componentWillUnmount(){
    window.removeEventListener('scroll', this._scroll);
    window.removeEventListener('resize', this._resize);
  }
  renderVals(){
    const active = this.props.active || 'home';
    const items = [['Home','index'],['About','about'],['Academics','academics'],['Admissions','admissions'],['Facilities','facilities'],['Gallery','gallery'],['Contact','contact']];
    const links = items.map(([label,key]) => {
      const k = key === 'index' ? 'home' : key;
      const is = k === active;
      return { label, href: key + '.dc.html', color: is ? '#17246E' : '#4A5578', weight: is ? '700' : '600', underlineBg: is ? '#12A6CE' : 'transparent' };
    });
    return {
      links,
      headerRef: this.headerRef,
      isMobile: this.state.isMobile,
      showDesktop: !this.state.isMobile,
      showMobileMenu: this.state.isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}
</script>
</body>
</html>

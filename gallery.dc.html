<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#F7F9FD}
  a{color:#12A6CE}a:hover{color:#0E1E5B}
  @media(max-width:900px){[style*="1.35fr 0.9fr"],[style*="1.1fr 1fr"],[style*="0.85fr 1.4fr"],[style*="auto 1fr"],[style*="1.3fr 1fr"],[style*="0.85fr 1.15fr"],[style*="1.15fr 0.85fr"],[style*="1fr 1fr"]{grid-template-columns:1fr !important}[style*="150px 24px 90px"]{padding-top:118px !important}[style*="120px 24px 80px"]{padding-top:104px !important}}
  @keyframes spinslow{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes zoomIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="font-family:'Plus Jakarta Sans',sans-serif;color:#1B2340;overflow-x:hidden">
  <dc-import name="NavBar" active="gallery" hint-size="100%,68px"></dc-import>

  <section style="position:relative;padding:150px 24px 90px;overflow:hidden;background:radial-gradient(800px 400px at 82% 10%,rgba(18,166,206,.4),transparent),linear-gradient(120deg,#0E1E5B,#17246E)">
    <div style="position:absolute;top:-30px;right:6%;width:220px;height:220px;opacity:.16;animation:spinslow 55s linear infinite"><dc-import name="Logo" hint-size="100%,100%"></dc-import></div>
    <div style="max-width:1240px;margin:0 auto;position:relative">
      <div style="display:flex;gap:8px;align-items:center;color:#9FAAD6;font-size:14px;margin-bottom:16px"><a href="index.dc.html" style="color:#9FAAD6;text-decoration:none">Home</a><span>/</span><span style="color:#F6C21C">Gallery</span></div>
      <h1 style="font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(34px,5vw,58px);color:#fff;margin:0 0 16px;letter-spacing:-.02em">Life at Steaphiin</h1>
      <p style="color:#D5DEF7;font-size:clamp(16px,1.6vw,19px);line-height:1.6;max-width:640px;margin:0">A glimpse of our campus, classrooms and everyday moments. Drop your own photos into any tile — click a tile to view it larger.</p>
    </div>
  </section>

  <section data-reveal style="max-width:1240px;margin:0 auto;padding:70px 24px 40px;opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s">
    <p style="text-align:center;color:#8A6300;font-size:14px;margin:0 auto 34px;max-width:640px"><span style="background:#FFF4D4;border-bottom:1.5px dashed #E0A400;padding:2px 6px;border-radius:4px;font-weight:600">[Placeholder gallery — replace these tiles with real school photos when available.]</span></p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:200px;gap:16px">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="8">
        <div style="position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(23,36,110,.1);grid-row:span {{ t.rows }};grid-column:span {{ t.cols }}">
          <image-slot id="{{ t.id }}" shape="rect" src="{{ t.src }}" placeholder="Drop a photo"></image-slot>
          <button onClick="{{ t.open }}" aria-label="View larger" style="position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;background:rgba(14,30,91,.6);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s" style-hover="background:#12A6CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
        </div>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;z-index:2000;background:rgba(8,14,40,.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:32px;animation:fadeIn .25s ease">
      <button onClick="{{ closeLightbox }}" aria-label="Close" style="position:absolute;top:24px;right:24px;width:48px;height:48px;border-radius:12px;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center">✕</button>
      <button onClick="{{ prev }}" aria-label="Previous" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">‹</button>
      <div style="width:min(900px,90vw);height:min(620px,80vh);border-radius:20px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5);animation:zoomIn .3s ease" onClick="{{ stop }}">
        <image-slot id="{{ activeId }}" shape="rect" src="{{ activeSrc }}" placeholder="Drop a photo"></image-slot>
      </div>
      <button onClick="{{ next }}" aria-label="Next" style="position:absolute;right:24px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">›</button>
    </div>
  </sc-if>

  <div style="padding:20px 0 0"><dc-import name="Footer" hint-size="100%,320px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { open:false, idx:0 };
  rootRef = React.createRef();
  componentDidMount(){
    const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.style.opacity='1';e.target.style.transform='translateY(0)';io.unobserve(e.target);}})},{threshold:0.08});
    if(this.rootRef.current) this.rootRef.current.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
    this._key=(e)=>{ if(!this.state.open) return; if(e.key==='Escape') this.setState({open:false}); if(e.key==='ArrowRight') this._go(1); if(e.key==='ArrowLeft') this._go(-1); };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount(){ window.removeEventListener('keydown', this._key); }
  _defs(){ return [
    {id:'g1', rows:2, cols:2, src:'assets/school-building.jpeg'},
    {id:'g2', rows:1, cols:1, src:''},{id:'g3', rows:1, cols:1, src:''},
    {id:'g4', rows:1, cols:2, src:''},{id:'g5', rows:1, cols:1, src:''},
    {id:'g6', rows:2, cols:1, src:''},{id:'g7', rows:1, cols:1, src:''},
    {id:'g8', rows:1, cols:1, src:''},{id:'g9', rows:1, cols:2, src:''}
  ]; }
  _go(d){ const n=this._defs().length; this.setState(s=>({idx:(s.idx+d+n)%n})); }
  renderVals(){
    const defs=this._defs();
    const tiles=defs.map((d,i)=>({ ...d, open:(e)=>{ e.stopPropagation(); this.setState({open:true, idx:i}); } }));
    const active=defs[this.state.idx]||defs[0];
    return { rootRef:this.rootRef, tiles,
      lightboxOpen:this.state.open, activeId:'lb_'+active.id, activeSrc:active.src,
      closeLightbox:()=>this.setState({open:false}),
      stop:(e)=>e.stopPropagation(),
      prev:(e)=>{e.stopPropagation(); this._go(-1);},
      next:(e)=>{e.stopPropagation(); this._go(1);} };
  }
}
</script>
</body>
</html>
